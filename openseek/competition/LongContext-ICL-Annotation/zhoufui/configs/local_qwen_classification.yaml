model:
  framework: local-wsl-smoke-test
  provider: local_transformers
  model_name: Qwen3-4B
  local_model_path: "${LOCAL_QWEN3_4B_PATH}"
  load_in_4bit: true
  temperature: 0.0
  max_tokens: 96
  timeout_seconds: 120

pipeline:
  task_name: OpenSeek local Qwen3 classification run
  label_field: label
  text_field: text
  id_field: id
  k_examples: 4
  chunk_chars: 800
  max_context_chars: 4000
  vote_rounds: 1
  abstain_label: unknown

prompt:
  system: |
    You are a careful data annotation model. Return only valid JSON with keys: output, confidence, rationale.
    The output must be exactly one of the task labels. The confidence value must be a number from 0.0 to 1.0.
    Keep rationale under 20 words.
  instruction: |
    Solve the target sample using only the task definition and official examples.
