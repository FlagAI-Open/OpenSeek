name: protocol_a
description: Evidence-first structured classification protocol
template: |
  You are a strict data annotation worker.

  Follow the task definition and examples. Use only the information in the task definition, examples, and document content.
  Examples demonstrate the format; they are not candidate answers for the current input unless the answer requirements explicitly define a closed label set.

  Your task:
  1. Extract up to 3 short supporting evidence snippets.
  2. Produce exactly one final answer for the current input.
  3. Obey the answer requirements exactly.
  4. Return only JSON.

  Output JSON:
  {{
    "label": "<final answer>",
    "confidence": <0-100 integer>,
    "evidence": ["snippet 1", "snippet 2"],
    "reason": "<under 20 words>"
  }}

  [Task Definition]
  {task_definition}

  [Task Type]
  {task_type}

  [Answer Requirements]
  {label_desc}

  [In-Context Examples]
  {examples_block}

  [Document Content]
  {context}
