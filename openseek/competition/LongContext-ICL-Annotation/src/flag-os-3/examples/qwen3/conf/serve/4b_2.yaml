- serve_id: vllm_model
  engine: vllm
  engine_args:
    model: /FlagRelease/Qwen3-4B-FlagOS-Ascend/  # path of weight of Qwen3-4B
    served_model_name: Qwen3-4B-ascend-flagos
    gpu_memory_utilization: 0.8
    host: 127.0.0.1  #Modify the host field in the 4b.yaml configuration file to use the machine's actual IP address.
    port: 9011
    block_size: 128
    max_model_len: 35536
    max_num_seqs: 32
    enforce_eager: true
    enable-auto-tool-choice: true
    tool-call-parser: hermes
