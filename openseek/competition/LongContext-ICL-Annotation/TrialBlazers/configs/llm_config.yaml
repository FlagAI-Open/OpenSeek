serve:
- serve_id: vllm_model
  engine: vllm
  engine_args:
    model: ${oc.env:FLAGSCALE_MODEL_PATH,../models/Qwen3-4B}
    served_model_name: Qwen3-4B
    host: 127.0.0.1
    uvicorn_log_level: warning
    port: 2026
    dtype: bfloat16
    tensor_parallel_size: 2
    gpu_memory_utilization: 0.94
    max_model_len: 32768
    max_num_seqs: 16
    trust_remote_code: true
    enable_chunked_prefill: true
    enable_prefix_caching: true
    enforce_eager: true

experiment:
  exp_name: qwen3_4b_ascend_vllm
  exp_dir: ${oc.env:FLAGSCALE_EXP_DIR,outputs/runs/${experiment.exp_name}}
  task:
    type: serve
  runner:
    hostfile: null
    nproc_per_node: 2
    deploy:
      use_fs_serve: false
  envs:
    ASCEND_RT_VISIBLE_DEVICES: 0,1
    CUDA_VISIBLE_DEVICES: 0,1
    CUDA_DEVICE_MAX_CONNECTIONS: 1
    ASCEND_LAUNCH_BLOCKING: 0
    VLLM_ASCEND_ENABLE_FLASHCOMM1: 0
    HF_HUB_OFFLINE: 1
    TRANSFORMERS_OFFLINE: 1
    PATH: ${hydra:runtime.cwd}/scripts/bin:${oc.env:PATH}

action: run

hydra:
  run:
    dir: ${experiment.exp_dir}/hydra
